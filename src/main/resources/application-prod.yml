spring:

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        jdbc:
          time_zone: Asia/Seoul

  datasource:
    driver-class-name: ${DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}

jwt:
  auth:
    secret: ${JWT_AUTH_SECRET}
  access-token-valid-time: ${JWT_ACCESS_TOKEN_VALID_TIME}     # 30분 (ms)
  refresh-token-valid-time: ${JWT_REFRESH_TOKEN_VALID_TIME}  # 7일 (ms)
